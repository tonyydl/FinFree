version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: finfree-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finfree
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - finfree-network

volumes:
  postgres_data:

networks:
  finfree-network:
    driver: bridge
