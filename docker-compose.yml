version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: finfree-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: finfree
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - finfree-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d finfree"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finfree-backend
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=finfree;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      Jwt__Key: ${JWT_KEY:-your-super-secret-key-minimum-32-characters-long-for-security}
      Jwt__Issuer: FinFree
      Jwt__Audience: FinFree
      Jwt__ExpiryInMinutes: 60
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - finfree-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finfree-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - finfree-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  finfree-network:
    driver: bridge
